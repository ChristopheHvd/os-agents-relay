name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            relais/package-lock.json
      - name: Kit
        run: npm ci && npm test
      - name: Relais
        working-directory: relais
        run: npm ci && npm test
